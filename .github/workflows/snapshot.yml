name: Daily player/free-agent snapshot

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python weekly_snapshot.py

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seasons/2026-27/player_status_log.csv seasons/2026-27/free_agents_log.csv
          git diff --staged --quiet || git commit -m "Daily snapshot $(date -u +%Y-%m-%d)"
          git push
