name: Gameweek data refresh

on:
  schedule:
    # Sun/Tue/Thu 09:00 UTC -- catches both weekend and midweek fixture rounds,
    # and keeps trade/waiver data current between gameweeks too.
    - cron: "0 9 * * 0,2,4"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  summary:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python weekly_summary.py
      - run: python power_rankings.py
      - run: python trade_impact.py
      - run: python predictions.py
      - run: python lineup_impact.py
      - run: python dashboard_stats.py

      # Rebuild the published dashboard from the refreshed data. Fonts come
      # from the committed cache in site/.fonts, so this needs no network.
      - run: python render_dashboard.py

      - id: stage
        run: |
          git add seasons/2026-27/weekly_summaries/ seasons/2026-27/power_rankings/ \
                  seasons/2026-27/*.md seasons/2026-27/*.json site/index.html
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.stage.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Weekly summary $(date -u +%Y-%m-%d)"
          git push

      - if: steps.stage.outputs.changed == 'true'
        run: |
          SUMMARY_FILE=$(ls -v seasons/2026-27/weekly_summaries/GW*_summary.md | tail -1)
          RANKINGS_FILE=$(ls -v seasons/2026-27/power_rankings/GW*_power_rankings.md | tail -1)
          GW=$(basename "$SUMMARY_FILE" | grep -oE '[0-9]+')

          {
            echo "@DJRay57 — new gameweek data is up."
            echo
            cat "$SUMMARY_FILE"
            echo
            cat "$RANKINGS_FILE"
            echo
            [ -f seasons/2026-27/trade_impact.md ] && cat seasons/2026-27/trade_impact.md
            echo
            [ -f seasons/2026-27/h2h_predictions.md ] && cat seasons/2026-27/h2h_predictions.md
            echo
            [ -f seasons/2026-27/season_projection.md ] && cat seasons/2026-27/season_projection.md
            echo
            [ -f seasons/2026-27/lineup_impact.md ] && cat seasons/2026-27/lineup_impact.md
          } > issue_body.md

          gh issue create \
            --title "GW${GW} summary + power rankings" \
            --body-file issue_body.md \
            --assignee DJRay57
